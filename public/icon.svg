<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.35" flood-color="#000" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Khata (Traditional Ledger Book) -->
  <g filter="url(#shadow)" transform="translate(96, 76)">
    <!-- Back cover / spine -->
    <rect x="0" y="0" width="320" height="360" rx="20" fill="url(#bookCover)" />
    <!-- Yellow traditional binding thread / border -->
    <rect x="16" y="16" width="288" height="328" rx="14" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-dasharray="16 8" />
    
    <!-- Ledger Spine accent -->
    <path d="M0,20 Q0,0 20,0 L48,0 L48,360 L20,360 Q0,360 0,340 Z" fill="#7f1d1d" opacity="0.6" />
    <line x1="48" y1="0" x2="48" y2="360" stroke="#fef08a" stroke-width="3" opacity="0.7" />

    <!-- Center Emblem / Rupee Coin -->
    <circle cx="160" cy="160" r="72" fill="url(#goldGrad)" stroke="#fef3c7" stroke-width="4" />
    <circle cx="160" cy="160" r="62" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="4 4" />
    
    <!-- Rupee Symbol ₹ -->
    <text x="160" y="188" font-family="Arial, sans-serif" font-size="82" font-weight="900" fill="#78350f" text-anchor="middle">₹</text>

    <!-- Bengali Title on Book "হিসাব খাতা" -->
    <rect x="58" y="260" width="204" height="48" rx="8" fill="#fef2f2" opacity="0.95" />
    <text x="160" y="294" font-family="'Hind Siliguri', 'Noto Sans Bengali', sans-serif" font-size="28" font-weight="700" fill="#991b1b" text-anchor="middle">হিসাব খাতা</text>
  </g>
</svg>
